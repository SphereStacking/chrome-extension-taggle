<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BBFFCC"/>
      <stop offset="100%" stop-color="#45B7D1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Tag icon -->
  <g transform="translate(64,64)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hash/tag symbol -->
    <line x1="-18" y1="-28" x2="-26" y2="28"/>
    <line x1="6" y1="-28" x2="-2" y2="28"/>
    <line x1="-32" y1="-10" x2="14" y2="-10"/>
    <line x1="-34" y1="10" x2="12" y2="10"/>
    <!-- Toggle dots -->
    <circle cx="30" cy="-16" r="5" fill="#fff" stroke="none"/>
    <circle cx="30" cy="0" r="5" fill="#fff" stroke="none" opacity="0.6"/>
    <circle cx="30" cy="16" r="5" fill="#fff" stroke="none" opacity="0.3"/>
  </g>
</svg>
