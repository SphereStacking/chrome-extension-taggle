name: Version Bump & Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Bump version
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/version: '.*'/version: '$VERSION'/" wxt.config.ts

      - name: Commit & push
        run: |
          git add package.json wxt.config.ts
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin main --tags

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Zip extension
        run: cd .output/chrome-mv3 && zip -r ../../chrome-extension-taggle-${{ steps.version.outputs.tag }}.zip .

      - name: Create Release with asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ steps.version.outputs.tag }} chrome-extension-taggle-${{ steps.version.outputs.tag }}.zip --generate-notes --title "${{ steps.version.outputs.tag }}"
